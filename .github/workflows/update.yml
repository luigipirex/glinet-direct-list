name: Update CN + UM direct list

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:       # lets you run it manually

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build combined list
        run: |
          {
            curl -fsSL https://raw.githubusercontent.com/SeanChangX/glinet-cn-direct/release/cn-ipv4.txt
            echo
            cat extra.txt
          } | grep -v '^[[:space:]]*$' > direct-ipv4.txt

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add direct-ipv4.txt
          git diff --cached --quiet || (git commit -m "Update list" && git push)
